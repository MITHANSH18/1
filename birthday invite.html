<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="You're invited to Mithansh's birthday on October 24."
    />
    <title>Birthday Invitation | Mithansh</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #253b3b;
        --muted: #617373;
        --paper: #f3f7f4;
        --card: #ffffff;
        --teal: #24635f;
        --coral: #e9795c;
        --line: #d9e5df;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 32px 20px;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 12%, #e2efe7 0, transparent 28%),
          var(--paper);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      .invite {
        width: min(100%, 680px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 12px 12px 0 #dbe9e0;
      }

      .invite-header {
        padding: 38px 44px 32px;
        color: #fff;
        background: var(--teal);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #d7e89c;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.6px;
      }

      h1,
      h2 {
        font-family: Georgia, "Times New Roman", serif;
      }
      h1 {
        margin: 0;
        font-size: 42px;
        line-height: 1.12;
      }
      .date {
        margin: 12px 0 0;
        color: #dce9e4;
        font-size: 17px;
      }

      .invite-content {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 30px;
        padding: 32px 44px 40px;
      }

      .birthday-image {
        display: block;
        width: 190px;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 5px;
        background: var(--paper);
      }

      h2 {
        margin: 0 0 12px;
        color: var(--teal);
        font-size: 23px;
      }
      .bring-list {
        margin: 0 0 26px;
        padding-left: 20px;
        color: var(--muted);
      }
      .bring-list li + li {
        margin-top: 5px;
      }

      .map-link {
        display: inline-block;
        padding: 11px 16px;
        border-radius: 4px;
        color: #fff;
        background: var(--coral);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .map-link:hover {
        background: #c95d43;
      }
      a:focus-visible {
        outline: 3px solid var(--coral);
        outline-offset: 4px;
      }

      @media (max-width: 560px) {
        .invite-header {
          padding: 30px 24px 26px;
        }
        h1 {
          font-size: 34px;
        }
        .invite-content {
          grid-template-columns: 1fr;
          gap: 24px;
          padding: 24px;
        }
        .birthday-image {
          width: min(100%, 260px);
        }
      }
    </style>
  </head>
  <body>
    <main class="invite">
      <header class="invite-header">
        <p class="eyebrow">YOU'RE INVITED</p>
        <h1>Mithansh's Birthday</h1>
        <p class="date">October 24</p>
      </header>

      <div class="invite-content">
        <img
          class="birthday-image"
          src="huzzur.jpeg"
          alt="Birthday celebration"
        />
        <div>
          <section aria-labelledby="bring-title">
            <h2 id="bring-title">What to bring</h2>
            <ul class="bring-list">
              <li>Blessings</li>
              <li>Love</li>
              <li>Gifts</li>
            </ul>
          </section>
          <section aria-labelledby="location-title">
            <h2 id="location-title">Find the celebration</h2>
            <a
              class="map-link"
              href="https://maps.app.goo.gl/ZJvNZGnCMAGYySkZ8"
              target="_blank"
              rel="noopener noreferrer"
              >Open Google Maps</a
            >
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
