<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div id="orb" aria-hidden="true"></div>
    <h1>J.A.R.V.I.S.</h1>
    <p id="status">Standing by</p>
  </header>
  <section id="log" aria-live="polite"></section>
  <form id="form" autocomplete="off">
    <button type="button" id="mic" title="Speak (voice input)">🎤</button>
    <input id="input" type="text" placeholder="Try: help, what time is it, 12 * (3+4), set timer 10 seconds…" autofocus>
    <button type="submit">Send</button>
  </form>
  <label class="opt"><input type="checkbox" id="speak" checked> Speak replies</label>
</main>
<script src="jarvis.js"></script>
</body>
</html>
